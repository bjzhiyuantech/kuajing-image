services:
  mysql:
    image: ${MYSQL_IMAGE:-public.ecr.aws/docker/library/mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gpt_image_canvas}
      MYSQL_USER: ${MYSQL_USER:-gpt_image_canvas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gpt_image_canvas}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-kuajing-image/app:private-cloud}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:22-bookworm-slim}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
    env_file:
      - path: .env
        required: false
      - path: .env.apns
        required: false
    environment:
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-private-cloud}
      DEPLOYMENT_TARGET: ${DEPLOYMENT_TARGET:-server}
      HOST: 0.0.0.0
      PORT: ${PORT:-8787}
      DATA_DIR: /app/data
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-gpt_image_canvas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gpt_image_canvas}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gpt_image_canvas}
    ports:
      - "${PORT:-8787}:${PORT:-8787}"
    volumes:
      - ./data:/app/data
      - ./downloads:/app/apps/web/dist/downloads
      - ./secrets/apns:/run/secrets/apns:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:${PORT:-8787}/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  default:
    driver: bridge
